<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Activity slide</title>
<!--MEGACSS-->
<style>html, body { margin: 0; }</style>
</head>
<body>
<div class="hotp-slide" style="background:var(--field-alt);">
  <div class="slide-bar">
    <div class="bar-title" style="background:var(--c-sky); justify-content:center;">warm up discussion</div>
    <div class="bar-dur">40mins</div>
  </div>

  <div class="panel" style="margin:88px 88px 0; min-height:660px; background:var(--c-cream);">
    <div class="spine" style="background:var(--c-crimson);"></div>
    <div class="panel-body" style="padding:72px 80px; display:flex; flex-direction:column; justify-content:center;">
      <div class="eyebrow" style="color:var(--c-crimson); margin-bottom:44px;">group agreement &rarr; go-arounds &rarr; open discussion</div>
      <h2 class="t-question" style="margin:0 0 40px; max-width:1400px;">What is AI to us? Where do we encounter it? How do we feel about where it&rsquo;s going?</h2>
      <p class="t-small" style="margin:0; max-width:1180px; color:var(--c-black);">These are starting points: our views will probably change! But let&rsquo;s explore our views and hear one-another out.</p>
    </div>
  </div>
</div>
</body>
</html>
