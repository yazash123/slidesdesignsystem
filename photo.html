<!-- @startingPoint section="Split slide" subtitle="Half documentary photo, half explanation" viewport="1920x1080" -->
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Photo split slide</title>
<!--MEGACSS-->
<style>
  html, body { margin: 0; }
  .matrix { display:grid; grid-template-columns:repeat(10, 24px); gap:11px; }
  .matrix span { width:24px; height:24px; border-radius:50%; display:block; }
  .note { background:var(--c-banana); padding:24px 28px; font:700 24px/1.25 var(--ff-sans); }
</style>
</head>
<body>
<div class="hotp-slide" style="display:flex;">
  <div style="width:960px; flex:none; position:relative;">
    <div style="background:var(--c-chambray); color:var(--ink-inverse); padding:44px var(--pad-edge) 48px;">
      <h1 class="t-title" style="margin:0;">what&rsquo;s a citizens&rsquo; assembly?</h1>
    </div>

    <div style="display:flex; align-items:center; gap:56px; padding:72px var(--pad-edge) 0;">
      <div class="matrix">
      <span style="background:var(--c-coral);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-mustard);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-mustard);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-mustard);"></span>
      <span style="background:var(--c-forest);"></span><span style="background:var(--c-forest);"></span><span style="background:var(--c-mustard);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-pink);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-mustard);"></span><span style="background:var(--c-banana);"></span>
      <span style="background:var(--c-orange);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-coral);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-forest);"></span><span style="background:var(--c-mustard);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-forest);"></span><span style="background:var(--c-crimson);"></span>
      <span style="background:var(--c-orange);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-pink);"></span><span style="background:var(--c-forest);"></span><span style="background:var(--c-coral);"></span>
      <span style="background:var(--c-pink);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-coral);"></span><span style="background:var(--c-forest);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-coral);"></span><span style="background:var(--c-pink);"></span>
      <span style="background:var(--c-chambray);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-coral);"></span><span style="background:var(--c-pink);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-coral);"></span><span style="background:var(--c-pink);"></span><span style="background:var(--c-coral);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-crimson);"></span>
      <span style="background:var(--c-coral);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-forest);"></span><span style="background:var(--c-forest);"></span><span style="background:var(--c-banana);"></span>
      <span style="background:var(--c-coral);"></span><span style="background:var(--c-coral);"></span><span style="background:var(--c-mustard);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-pink);"></span><span style="background:var(--c-coral);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-forest);"></span>
      <span style="background:var(--c-coral);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-pink);"></span><span style="background:var(--c-pink);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-chambray);"></span>
      <span style="background:var(--c-banana);"></span><span style="background:var(--c-chambray);"></span><span style="background:var(--c-coral);"></span><span style="background:var(--c-crimson);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-orange);"></span><span style="background:var(--c-purple);"></span><span style="background:var(--c-forest);"></span><span style="background:var(--c-banana);"></span><span style="background:var(--c-chambray);"></span>
      </div>
      <p style="margin:0; font:600 40px/1.15 var(--ff-serif); max-width:300px;">people from everyday life</p>
    </div>

    <div style="display:flex; gap:20px; padding:56px var(--pad-edge) 0;">
      <span class="note">chosen by democratic lottery</span>
      <span class="note">given time and balanced evidence</span>
      <span class="note">with an equal voice</span>
    </div>

    <div style="position:absolute; left:var(--pad-edge); bottom:88px; display:flex; align-items:center; gap:32px;">
      <span style="font:600 44px/1.1 var(--ff-serif);"><s>Debate</s> Deliberate on</span>
      <span style="background:var(--c-pink); padding:22px 30px; font:700 30px/1.2 var(--ff-sans);">choices for the common good.</span>
    </div>
  </div>

  <!-- a photograph fills the whole tile: no border, no caption over it -->
  <div style="flex:1; background:var(--c-grey-soft); display:flex; align-items:center; justify-content:center;">
    <span class="t-eyebrow" style="color:var(--ink-mute); font-size:22px;">documentary photograph fills this tile</span>
  </div>
</div>
</body>
</html>
