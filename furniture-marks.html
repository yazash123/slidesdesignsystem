<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><!--MEGACSS--><style>
  html, body { margin:0; }
  body { padding:24px; background:var(--c-white); font-family:var(--ff-sans); box-sizing:border-box; }
  .sw { display:flex; align-items:flex-end; padding:12px; box-sizing:border-box; }
  .sw b { font:700 15px/1.2 var(--ff-sans); display:block; }
  .sw span { font:400 13px/1.4 var(--ff-sans); opacity:.85; }
  .lbl { font:700 12px/1 var(--ff-sans); text-transform:uppercase; letter-spacing:.12em; color:var(--ink-mute); margin:0 0 10px; }
  .scale { transform:scale(.34); transform-origin:0 0; }
</style></head><body>
<div style="height:160px; overflow:hidden;"><div class="scale" style="width:1920px;">
     <div style="background:var(--c-sky); padding:36px 44px; display:flex; flex-direction:column; gap:30px;">
       <div class="eyebrow"><span class="chip" style="background:var(--c-coral);"></span>setting off</div>
       <p class="t-body" style="margin:0;">The impacts of battery production are <mark>significant</mark>.</p>
       <p class="t-body bullet" style="margin:0;">Trained on a huge slice of the internet&rsquo;s text.</p>
       <div style="display:flex; align-items:center; gap:24px;">
         <span style="background:var(--c-forest); color:var(--ink-inverse); padding:16px 24px; font:700 28px/1 var(--ff-sans);">A goal</span>
         <span style="flex:none; width:34px; height:20px; background:var(--ink); clip-path:polygon(0 30%,58% 30%,58% 0,100% 50%,58% 100%,58% 70%,0 70%);"></span>
         <span style="background:var(--c-mustard); padding:16px 24px; font:700 28px/1 var(--ff-sans);">a result</span>
       </div>
     </div>
   </div></div>
</body></html>
