<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Rounds slide</title>
<!--MEGACSS-->
<style>html, body { margin: 0; }</style>
</head>
<body>
<div class="hotp-slide" style="background:var(--c-forest);">
  <div class="slide-bar">
    <div class="bar-title" style="background:var(--c-banana); justify-content:center;">let&rsquo;s meet each other</div>
    <div class="bar-dur">20 mins</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:var(--stack-gap); margin:80px 88px 0;">
    <div class="panel" style="background:var(--c-sky);">
      <div class="spine" style="background:var(--c-pink);"></div>
      <div class="panel-body" style="padding:56px 72px;">
        <div class="eyebrow" style="color:var(--c-forest); margin-bottom:28px;">round 1</div>
        <h2 class="t-question" style="margin:0;">Who are you? Where do you call home?</h2>
      </div>
    </div>

    <div class="panel" style="background:var(--c-sky);">
      <div class="spine" style="background:var(--c-orange);"></div>
      <div class="panel-body" style="padding:56px 72px;">
        <div class="eyebrow" style="color:var(--c-forest); margin-bottom:28px;">round 2</div>
        <h2 class="t-question" style="margin:0 0 32px; max-width:1420px;">What are the first words that come to mind when you hear &lsquo;AI&rsquo;, and why?</h2>
        <p class="t-small" style="margin:0;">If you&rsquo;d rather not share yet, that&rsquo;s okay too. No one will define or correct your answer.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
