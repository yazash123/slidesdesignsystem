/* ---------------------------------------------------------------
   COLOURS — 10 brand colours, sampled from the real slide decks.
   Three tonal groups. Every composition takes one from each group.
   Text is WHITE on dark, BLACK on medium and light. No exceptions.
   --------------------------------------------------------------- */
:root {
  /* DARK — white text */
  --c-crimson:    #C0184F;
  --c-forest:     #387030;
  --c-chambray:   #5878A0;

  /* MEDIUM — black text (white is allowed on pink/purple/coral for
     short all-caps tile labels only — see readme) */
  --c-pink:       #E078B0;
  --c-purple:     #B868C0;
  --c-coral:      #E06050;
  --c-orange:     #E08850;

  /* LIGHT — black text */
  --c-sky:        #C0E8F8;   /* the default slide field */
  --c-banana:     #F0E060;
  --c-mustard:    #E0C060;

  /* INK & PAPER */
  --c-black:      #0A0A0A;
  --c-white:      #FFFFFF;
  --c-cream:      #FDFCF3;   /* softer panel white, used on dark fields */
  --c-grey:       #6B6B6B;   /* labels on white panels only */
  --c-grey-soft:  #E5E5E5;   /* empty bar track in charts */

  /* ROLES */
  --field:        var(--c-sky);       /* default slide background */
  --field-alt:    var(--c-chambray);  /* activity / discussion slides */
  --panel:        var(--c-white);     /* content panel on a field */
  --ink:          var(--c-black);
  --ink-inverse:  var(--c-white);
  --ink-mute:     var(--c-grey);
  --highlight:    var(--c-banana);    /* text highlighter */
}
/* ---------------------------------------------------------------
   TYPE — sized for a 1920×1080 slide. Nothing below 22px.
   Adelphe (serif)  = titles, headlines, questions, big numbers.
   BBB Poppins TN (sans) = eyebrows, labels, body, notes, tile caps.
   Weights: 400 and 600 (serif) / 700 (sans). That is all.
   --------------------------------------------------------------- */
:root {
  --ff-serif: "Adelphe", Georgia, serif;
  --ff-sans:  "BBB Poppins TN", "Poppins", system-ui, sans-serif;

  --fs-hero:     104px;  /* one big statement */
  --fs-stat:     140px;  /* one big number */
  --fs-title:     64px;  /* slide title in the header bar (lowercase serif) */
  --fs-h1:        56px;  /* content headline */
  --fs-question:  46px;  /* discussion prompt inside a panel */
  --fs-tile:      40px;  /* all-caps sans label inside a colour tile */
  --fs-lead:      32px;
  --fs-body:      26px;
  --fs-small:     22px;
  --fs-eyebrow:   22px;

  --lh-tight: 1.02;
  --lh-snug:  1.12;
  --lh-body:  1.35;
  --ls-caps:  0.12em;
}

/* Optional helper classes — tokens are the contract, these are shortcuts. */
.t-hero     { font: 600 var(--fs-hero)/var(--lh-tight) var(--ff-serif); }
.t-stat     { font: 600 var(--fs-stat)/0.9 var(--ff-serif); }
.t-title    { font: 600 var(--fs-title)/var(--lh-tight) var(--ff-serif); text-transform: lowercase; }
.t-h1       { font: 600 var(--fs-h1)/var(--lh-snug) var(--ff-serif); }
.t-question { font: 600 var(--fs-question)/var(--lh-snug) var(--ff-serif); }
.t-tile     { font: 700 var(--fs-tile)/var(--lh-snug) var(--ff-sans); text-transform: uppercase; }
.t-lead     { font: 400 var(--fs-lead)/var(--lh-body) var(--ff-sans); }
.t-body     { font: 400 var(--fs-body)/var(--lh-body) var(--ff-sans); }
.t-small    { font: 400 var(--fs-small)/var(--lh-body) var(--ff-sans); }
.t-eyebrow  { font: 700 var(--fs-eyebrow)/1 var(--ff-sans); text-transform: uppercase; letter-spacing: var(--ls-caps); }
.t-serif    { font-family: var(--ff-serif); }
.t-sans     { font-family: var(--ff-sans); }
/* ---------------------------------------------------------------
   SLIDE GEOMETRY — one canvas, one set of measurements.
   Everything square. No radii, no shadows, no gutters between tiles.
   --------------------------------------------------------------- */
:root {
  --slide-w: 1920px;
  --slide-h: 1080px;

  --pad-edge:  88px;   /* content inset on an untiled field */
  --bar-h:    150px;   /* header bar height */
  --spine-w:   22px;   /* coloured spine down the left of a panel */
  --panel-pad: 64px;
  --stack-gap: 44px;   /* between stacked panels on one slide */

  --bw-rule: 3px;      /* the only border weight */
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}

/* --- the canvas ------------------------------------------------ */
.hotp-slide {
  position: relative;
  width: var(--slide-w);
  height: var(--slide-h);
  overflow: hidden;
  background: var(--field);
  color: var(--ink);
  font-family: var(--ff-sans);
}

/* --- header bar: title tile + optional duration chip ----------- */
.slide-bar { display: flex; height: var(--bar-h); }
.slide-bar > .bar-title {
  flex: 1;
  display: flex; align-items: center;
  padding: 0 var(--pad-edge);
  font: 600 var(--fs-title)/var(--lh-tight) var(--ff-serif);
  text-transform: lowercase;
}
.slide-bar > .bar-dur {
  display: flex; align-items: center; padding: 0 56px;
  background: var(--c-mustard);
  font: 700 var(--fs-title)/1 var(--ff-sans);
}

/* --- panel with a coloured spine ------------------------------- */
.panel {
  display: flex;
  background: var(--panel);
}
.panel > .spine { width: var(--spine-w); flex: none; }
.panel > .panel-body { padding: var(--panel-pad); }

/* --- eyebrow with a square colour chip ------------------------- */
.eyebrow { display: flex; align-items: center; gap: 16px;
  font: 700 var(--fs-eyebrow)/1 var(--ff-sans);
  text-transform: uppercase; letter-spacing: var(--ls-caps); }
.eyebrow > .chip { width: 22px; height: 22px; flex: none; }

/* --- tiles: they touch, they never round ---------------------- */
.tile-grid { display: grid; gap: 0; }
.tile { display: flex; padding: 48px; }

/* --- text highlighter ---------------------------------------- */
mark, .mark { background: var(--highlight); color: var(--ink); padding: 0 .1em; }

/* --- square bullet ------------------------------------------- */
.bullet { display: flex; gap: 20px; }
.bullet::before { content: ""; flex: none; width: 18px; height: 18px;
  background: currentColor; margin-top: .45em; }

/* --- interaction (rarely needed on slides) -------------------- */
a { color: var(--c-crimson); text-decoration: none;
  border-bottom: var(--bw-rule) solid currentColor; }
a:hover { color: var(--c-forest); }

</style>

    <h1 class="t-h1" style="margin:0 0 52px;">The road behind us.</h1>

    <div style="display:flex; gap:36px; margin-bottom:36px;">
      <div style="flex:1; background:var(--c-mustard); padding:32px 40px;">
        <p style="margin:0 0 10px; font:700 34px/1.1 var(--ff-sans);">&ldquo;AI&rdquo; is a label, not one thing</p>
        <p class="t-small" style="margin:0;">A seventy-year-old term, used to describe very different things.</p>
      </div>
      <div style="flex:1; background:var(--c-forest); color:var(--ink-inverse); padding:32px 40px;">
        <p style="margin:0 0 10px; font:700 34px/1.1 var(--ff-sans);">Three kinds of software</p>
        <p class="t-small" style="margin:0;">Rules-based &mdash; optimisation &mdash; machine learning.</p>
      </div>
    </div>

    <div style="display:flex; gap:36px;">
      <div class="card">
        <div class="head" style="background:var(--c-banana);">idea 1 &mdash; the house</div>
        <div class="body">
          <p style="margin:0 0 6px; font:700 32px/1.15 var(--ff-sans);">Drawing a line through data</p>
          <p style="margin:0 0 28px; font:400 italic 26px/1.3 var(--ff-serif); color:var(--ink-mute);">Averages &amp; optimisation</p>
          <p class="t-small bullet" style="margin:0 0 16px;">Using examples to learn a trend.</p>
          <p class="t-small bullet" style="margin:0 0 16px;">More data makes the line steadier.</p>
          <p class="t-small bullet" style="margin:0;">Data must be relevant &mdash; there are lots of coincidences to be found.</p>
        </div>
      </div>
      <div class="card">
        <div class="head" style="background:var(--c-orange);">idea 2 &mdash; the car</div>
        <div class="body">
          <p style="margin:0 0 6px; font:700 32px/1.15 var(--ff-sans);">Stacking predictions in layers</p>
          <p style="margin:0 0 28px; font:400 italic 26px/1.3 var(--ff-serif); color:var(--ink-mute);">Neural networks</p>
          <p class="t-small bullet" style="margin:0 0 16px;">We give the model all the clues; it finds their relative importance.</p>
          <p class="t-small bullet" style="margin:0 0 16px;">Tested against lots of examples and tuned, bit by bit.</p>
          <p class="t-small bullet" style="margin:0;">No one can read the layers straightforwardly.</p>
        </div>
      </div>
      <div class="card">
        <div class="head" style="background:var(--c-pink);">idea 3 &mdash; the chatbot</div>
        <div class="body">
          <p style="margin:0 0 6px; font:700 32px/1.15 var(--ff-sans);">Predicting the next word</p>
          <p style="margin:0 0 28px; font:400 italic 26px/1.3 var(--ff-serif); color:var(--ink-mute);">Large language models</p>
          <p class="t-small bullet" style="margin:0 0 16px;">Its main job: guess the next word in the sentence.</p>
          <p class="t-small bullet" style="margin:0 0 16px;">It mirrors your tone: questions influence the answers.</p>
          <p class="t-small bullet" style="margin:0;">It pattern-matches, and sometimes makes things up.</p>
