<!-- CARD group="Colors" name="The colour rule" subtitle="One dark + one medium + one light in every composition" viewport="700x190" -->
<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><!--MEGACSS--><style>
  html, body { margin:0; }
  body { padding:24px; background:var(--c-white); font-family:var(--ff-sans); box-sizing:border-box; }
  .sw { display:flex; align-items:flex-end; padding:12px; box-sizing:border-box; }
  .sw b { font:700 15px/1.2 var(--ff-sans); display:block; }
  .sw span { font:400 13px/1.4 var(--ff-sans); opacity:.85; }
  .lbl { font:700 12px/1 var(--ff-sans); text-transform:uppercase; letter-spacing:.12em; color:var(--ink-mute); margin:0 0 10px; }
  .scale { transform:scale(.34); transform-origin:0 0; }
</style></head><body>
<p class="lbl">a composition that works</p>
   <div style="display:flex; height:110px;">
     <div style="flex:1.4; background:var(--c-sky); display:flex; align-items:flex-end; padding:12px; font:700 14px/1 var(--ff-sans);">LIGHT — the field</div>
     <div style="flex:1; background:var(--c-chambray); color:var(--c-white); display:flex; align-items:flex-end; padding:12px; font:700 14px/1 var(--ff-sans);">DARK — the panel spine</div>
     <div style="flex:1; background:var(--c-orange); display:flex; align-items:flex-end; padding:12px; font:700 14px/1 var(--ff-sans);">MEDIUM — the tiles</div>
   </div>
</body></html>
