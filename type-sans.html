<!-- CARD group="Type" name="BBB Poppins TN — the sans" subtitle="Eyebrows, tile labels, body, notes" viewport="700x200" -->
<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><!--MEGACSS--><style>
  html, body { margin:0; }
  body { padding:24px; background:var(--c-white); font-family:var(--ff-sans); box-sizing:border-box; }
  .sw { display:flex; align-items:flex-end; padding:12px; box-sizing:border-box; }
  .sw b { font:700 15px/1.2 var(--ff-sans); display:block; }
  .sw span { font:400 13px/1.4 var(--ff-sans); opacity:.85; }
  .lbl { font:700 12px/1 var(--ff-sans); text-transform:uppercase; letter-spacing:.12em; color:var(--ink-mute); margin:0 0 10px; }
  .scale { transform:scale(.34); transform-origin:0 0; }
</style></head><body>
<p style="margin:0; font:700 34px/1.1 var(--ff-sans); text-transform:uppercase;">All voices are equal</p>
   <p style="margin:12px 0 0; font:400 20px/1.35 var(--ff-sans);">These are starting points: our views will probably change.</p>
   <p class="lbl" style="margin-top:16px;">BBB Poppins TN Text — 700 / 400</p>
</body></html>
