<!-- CARD group="Colors" name="Palette — Dark" subtitle="Text on these is white" viewport="700x160" -->
<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><!--MEGACSS--><style>
  html, body { margin:0; }
  body { padding:24px; background:var(--c-white); font-family:var(--ff-sans); box-sizing:border-box; }
  .sw { display:flex; align-items:flex-end; padding:12px; box-sizing:border-box; }
  .sw b { font:700 15px/1.2 var(--ff-sans); display:block; }
  .sw span { font:400 13px/1.4 var(--ff-sans); opacity:.85; }
  .lbl { font:700 12px/1 var(--ff-sans); text-transform:uppercase; letter-spacing:.12em; color:var(--ink-mute); margin:0 0 10px; }
  .scale { transform:scale(.34); transform-origin:0 0; }
</style></head><body>
<div style="display:flex; gap:0;">
    <div class="sw" style="flex:1; height:104px; background:var(--c-crimson); color:var(--c-white);"><div><b>Crimson</b><span>#C0184F</span></div></div>
    <div class="sw" style="flex:1; height:104px; background:var(--c-forest); color:var(--c-white);"><div><b>Forest</b><span>#387030</span></div></div>
    <div class="sw" style="flex:1; height:104px; background:var(--c-chambray); color:var(--c-white);"><div><b>Chambray</b><span>#5878A0</span></div></div>
  </div>
</body></html>
