<!-- CARD group="Colors" name="Palette — Medium" subtitle="Text on these is black" viewport="700x160" -->
<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><!--MEGACSS--><style>
  html, body { margin:0; }
  body { padding:24px; background:var(--c-white); font-family:var(--ff-sans); box-sizing:border-box; }
  .sw { display:flex; align-items:flex-end; padding:12px; box-sizing:border-box; }
  .sw b { font:700 15px/1.2 var(--ff-sans); display:block; }
  .sw span { font:400 13px/1.4 var(--ff-sans); opacity:.85; }
  .lbl { font:700 12px/1 var(--ff-sans); text-transform:uppercase; letter-spacing:.12em; color:var(--ink-mute); margin:0 0 10px; }
  .scale { transform:scale(.34); transform-origin:0 0; }
</style></head><body>
<div style="display:flex;">
    <div class="sw" style="flex:1; height:104px; background:var(--c-pink); color:var(--ink);"><div><b>Pink</b><span>#E078B0</span></div></div>
    <div class="sw" style="flex:1; height:104px; background:var(--c-purple); color:var(--ink);"><div><b>Purple</b><span>#B868C0</span></div></div>
    <div class="sw" style="flex:1; height:104px; background:var(--c-coral); color:var(--ink);"><div><b>Coral</b><span>#E06050</span></div></div>
    <div class="sw" style="flex:1; height:104px; background:var(--c-orange); color:var(--ink);"><div><b>Orange</b><span>#E08850</span></div></div>
  </div>
</body></html>
