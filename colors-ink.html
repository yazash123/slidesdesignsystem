<!-- CARD group="Colors" name="Ink & paper" subtitle="Panels and type colours" viewport="700x160" -->
<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><!--MEGACSS--><style>
  html, body { margin:0; }
  body { padding:24px; background:var(--c-white); font-family:var(--ff-sans); box-sizing:border-box; }
  .sw { display:flex; align-items:flex-end; padding:12px; box-sizing:border-box; }
  .sw b { font:700 15px/1.2 var(--ff-sans); display:block; }
  .sw span { font:400 13px/1.4 var(--ff-sans); opacity:.85; }
  .lbl { font:700 12px/1 var(--ff-sans); text-transform:uppercase; letter-spacing:.12em; color:var(--ink-mute); margin:0 0 10px; }
  .scale { transform:scale(.34); transform-origin:0 0; }
</style></head><body>
<div style="display:flex;">
    <div class="sw" style="flex:1; height:104px; background:var(--c-black); color:var(--c-white);"><div><b>Black</b><span>#0A0A0A</span></div></div>
    <div class="sw" style="flex:1; height:104px; background:var(--c-white); color:var(--ink); box-shadow:inset 0 0 0 1px var(--c-grey-soft);"><div><b>White</b><span>#FFFFFF panel</span></div></div>
    <div class="sw" style="flex:1; height:104px; background:var(--c-cream); color:var(--ink); box-shadow:inset 0 0 0 1px var(--c-grey-soft);"><div><b>Cream</b><span>#FDFCF3 panel</span></div></div>
    <div class="sw" style="flex:1; height:104px; background:var(--c-grey); color:var(--c-white);"><div><b>Grey</b><span>#6B6B6B label</span></div></div>
  </div>
</body></html>
